<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>OURu · Station · Vector‑Hub · Axiom‑Orbit</title>

<style>
  body {
    background: #000;
    color: #0f0;
    font-family: monospace;
    padding: 20px;
  }
  .panel {
    border: 1px solid #0f0;
    padding: 10px;
    margin-bottom: 20px;
  }
  h2 { margin: 0 0 10px 0; }
</style>
</head>

<body>

<h1>OURu · Station · Vector‑Hub · Axiom‑Orbit</h1>

<div class="panel">
  <h2>Orbit‑Engine</h2>
  <pre id="orbit"></pre>
</div>

<div class="panel">
  <h2>Axiom‑Core</h2>
  <pre id="axiom"></pre>
</div>

<div class="panel">
  <h2>Module‑Output (A–Z)</h2>
  <pre id="modules"></pre>
</div>

<script type="module">

  /* MODULES A–Z */
  import { A } from "./A.js";
  import { B } from "./B.js";
  import { C } from "./C.js";
  import { D } from "./D.js";
  import { E } from "./E.js";
  import { F } from "./F.js";
  import { G } from "./G.js";
  import { H } from "./H.js";
  import { K } from "./K.js";
  import { L } from "./L.js";
  import { P } from "./P.js";
  import { V } from "./V.js";

  /* AXIOME */
  import { HighwayAxiom } from "./Highway-Axiom.js";
  import { KomplettumAxiom } from "./Komplettum-Axiom.js";
  import { MEAxiom } from "./ME-Axiom.js";
  import { OperatorAxiom } from "./Operator-Axiom.js";
  import { RADAxiom } from "./RAD-Axiom.js";
  import { ScanAxiom } from "./Scan-Axiom.js";
  import { SlalomAxiom } from "./Slalom-Axiom.js";
  import { PhiAxiom } from "./Phi-Axiom.js";
  import { IORAxiom } from "./IOR-Axiom.js";
  import { FlagAxiom } from "./flag.vector.js";

  /* DREIECK */
  import { Axiom698869 } from "./698869.js";

  const modules = [A, B, C, D, E, F, G, H, K, L, P, V];

  function tick() {

    modules.forEach(m => m.run());

    document.getElementById("orbit").innerText =
      "A: " + A.VALUE + " | R=" + A.RADIUS + " | O=" + A.ORBIT + "\n" +
      "B: " + B.VALUE + " | R=" + B.RADIUS + " | O=" + B.ORBIT;

    document.getElementById("axiom").innerText =
      JSON.stringify({
        highway: HighwayAxiom,
        komplettum: KomplettumAxiom,
        me: MEAxiom,
        operator: OperatorAxiom,
        rad: RADAxiom,
        scan: ScanAxiom,
        slalom: SlalomAxiom,
        phi: PhiAxiom,
        ior: IORAxiom,
        flag: FlagAxiom,
        ax698869: Axiom698869
      }, null, 2);

    let out = "";
    modules.forEach(m => {
      out += m.NAME + ": " + m.VALUE + " | R=" + m.RADIUS + " | O=" + m.ORBIT + "\n";
    });
    document.getElementById("modules").innerText = out;
  }

  setInterval(tick, 1000);

</script>

</body>
</html>
